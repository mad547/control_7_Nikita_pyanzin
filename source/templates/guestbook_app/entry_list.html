{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Гостевая книга</h1>
    <a href="{% url 'entry_add' %}" class="btn btn-primary">
        <i class="fas fa-plus me-1">Добавить запись</i>
    </a>
</div>

{% for entry in entries %}
<div class="card mb-3 shadow-sm">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h6 class="card-title mb-0 fw-bold">
                    {{ entry.name }}
                    <span class="text-muted fw-normal">({{ entry.email }})</span>
                </h6>
                <small class="text-muted">{{ entry.created_at|date:'d.m.Y H:i' }}</small>
            </div>
            <div>
                <a href="{% url 'entry_edit' entry.id %}" class="btn btn-sm btn-outline-secondary me-1"
                title="Редактировать">
                    <i class="fa fa-pen"></i>
                </a>
                <a href="{% url 'entry_delete' entry.id %}" class="btn btn-sm btn-outline-danger"
                title="Удалить">
                    <i class="fa fa-trash"></i>
                </a>
            </div>
        </div>
        <p class="card-text mt-2" style="white-space: pre-wrap;">{{ entry.text }}</p>
    </div>
</div>
{% empty %}
<div class="alert alert-info">Записей пока нет. Будьте первым</div>
{% endfor %}
{% endblock %}
